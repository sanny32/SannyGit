[package]
name = "sannygit"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
description = "A simple, fast, modern, open-source Git GUI client"

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
egui_extras = { version = "0.31", features = ["svg"] }
serde = { version = "1", features = ["derive"] }
