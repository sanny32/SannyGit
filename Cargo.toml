[package]
name = "sannygit"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "A simple, fast, modern, open-source Git GUI client"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "accesskit", "default_fonts", "glow", "persistence", "wayland", "x11",
] }
egui_extras = { version = "0.37", features = ["svg"] }
serde = { version = "1", features = ["derive"] }
display-info = "0.5.10"
mouse_position = "0.1.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSString"] }
