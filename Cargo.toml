[package]
name = "sannygit"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "A simple, fast, modern, open-source Git GUI client"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rfd = "0.17.2"
eframe = { version = "0.37", default-features = false, features = [
    "accesskit", "default_fonts", "glow", "persistence", "wayland", "x11",
] }
egui_extras = { version = "0.37", features = ["svg", "image"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "time"] }
display-info = "0.5.10"
mouse_position = "0.1.4"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }
security-framework = { version = "3.7", features = ["OSX_10_15"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSString"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[build-dependencies]
winresource = "0.1"
