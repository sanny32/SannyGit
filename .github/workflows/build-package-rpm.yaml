name: Build RPM package

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: package-rpm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Install checkout and build dependencies
        run: |
          dnf install -y ca-certificates git curl python3 tar gzip findutils gcc gcc-c++ pkgconf-pkg-config \
            dbus-devel wayland-devel libxkbcommon-devel libX11-devel \
            libXrandr-devel libXi-devel libXcursor-devel mesa-libGL-devel libxcb-devel \
            rpm-build desktop-file-utils
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/project-version
        id: version
      - name: Build and stage package root
        run: ./build.sh --install="$GITHUB_WORKSPACE/target/rpm-root/usr"
      - name: Build and verify RPM
        env:
          RPM_VERSION: ${{ steps.version.outputs.rpm_version }}
          RPM_RELEASE: ${{ steps.version.outputs.rpm_release }}
        run: |
          desktop-file-validate target/rpm-root/usr/share/applications/SannyGit.desktop
          rpmbuild -bb .github/linux/rpm/sannygit.spec.in \
            --define "_topdir $GITHUB_WORKSPACE/target/rpmbuild" \
            --define "app_version $RPM_VERSION" --define "app_release $RPM_RELEASE" \
            --define "stage_root $GITHUB_WORKSPACE/target/rpm-root"
          mkdir -p target/ci-dist
          mapfile -t packages < <(find target/rpmbuild/RPMS -name '*.rpm' -type f)
          test "${#packages[@]}" -eq 1
          output="${packages[0]}"
          test "$(rpm -qp --queryformat '%{NAME}' "$output")" = sannygit
          test "$(rpm -qp --queryformat '%{VERSION}' "$output")" = "$RPM_VERSION"
          rpm -qpl "$output"
          rpm -qp --requires "$output"
          cp "$output" target/ci-dist/
          (cd target/ci-dist && sha256sum ./*.rpm > SHA256SUMS)
      - uses: actions/upload-artifact@v6
        with:
          name: sannygit-linux-rpm
          path: target/ci-dist/*
          if-no-files-found: error
