name: Build AppImage

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: package-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LINUXDEPLOY_VERSION: 1-alpha-20251107-1
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 git curl file patchelf desktop-file-utils \
            libdbus-1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libx11-dev \
            libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev libxcb1-dev libxcb-randr0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/project-version
        id: version
      - name: Build and stage AppDir
        run: ./build.sh --install="$GITHUB_WORKSPACE/target/AppDir/usr"
      - name: Build and verify AppImage
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$(uname -m)" = x86_64
          tool="$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"
          curl --proto '=https' --tlsv1.2 -fL --retry 3 \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/$LINUXDEPLOY_VERSION/linuxdeploy-x86_64.AppImage" -o "$tool"
          chmod +x "$tool"
          appdir="$GITHUB_WORKSPACE/target/AppDir"
          desktop-file-validate "$appdir/usr/share/applications/io.github.sanny32.SannyGit.desktop"
          libraries=()
          # winit loads these at runtime, so ELF dependency scanning cannot find them.
          for name in libxkbcommon.so.0 libxkbcommon-x11.so.0 libwayland-client.so.0 libwayland-cursor.so.0; do
            library="$(ldconfig -p | awk -v name="$name" '$1 == name && !found { path=$NF; found=1 } END { if (!found) exit 1; print path }')"
            libraries+=(--library "$library")
          done
          mkdir -p target/ci-dist
          export ARCH=x86_64 VERSION="$APP_VERSION"
          export LDAI_OUTPUT="$GITHUB_WORKSPACE/target/ci-dist/SannyGit-$APP_VERSION-x86_64.AppImage"
          "$tool" --appdir "$appdir" --executable "$appdir/usr/bin/sannygit" \
            --desktop-file "$appdir/usr/share/applications/io.github.sanny32.SannyGit.desktop" \
            --icon-file "$appdir/usr/share/icons/hicolor/256x256/apps/sannygit.png" \
            "${libraries[@]}" --output appimage
          test -x "$LDAI_OUTPUT"
          file "$LDAI_OUTPUT"
          mkdir -p "$RUNNER_TEMP/appimage-verify"
          (cd "$RUNNER_TEMP/appimage-verify" && "$LDAI_OUTPUT" --appimage-extract > extract.log)
          test -x "$RUNNER_TEMP/appimage-verify/squashfs-root/usr/bin/sannygit"
          test -f "$RUNNER_TEMP/appimage-verify/squashfs-root/usr/share/licenses/sannygit/LICENSE"
          test -f "$RUNNER_TEMP/appimage-verify/squashfs-root/usr/share/licenses/sannygit/SourceSans3-OFL.txt"
          (cd target/ci-dist && sha256sum ./*.AppImage > SHA256SUMS)
      - uses: actions/upload-artifact@v6
        with:
          name: sannygit-linux-appimage
          path: target/ci-dist/*
          if-no-files-found: error
