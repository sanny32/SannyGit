name: Build and Test

on:
  push:
    paths: &test_paths
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'build.sh'
      - 'build.ps1'
      - 'scripts/test_build_scripts.py'
      - 'LICENSE'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'rustfmt.toml'
      - '.rustfmt.toml'
      - 'clippy.toml'
      - '.clippy.toml'
      - 'assets/fonts/*.ttf'
      - 'assets/fonts/OFL.txt'
      - 'assets/icons/*.svg'
      - 'assets/previews/*.png'
      - 'assets/app/sannygit.png'
      - 'assets/app/sannygit.svg'
      - 'assets/app/sannygit.ico'
      - 'assets/app/sannygit.icns'
      - '.github/workflows/build*'
      - '.github/actions/project-version/**'
      - '.github/macos/**'
      - '.github/windows/**'
      - '.github/linux/**'
      - '!**/*.md'
  pull_request:
    paths: *test_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libdbus-1-dev libwayland-dev libxkbcommon-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev libxcb1-dev libxcb-randr0-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Check build scripts and macOS entitlements
        if: runner.os == 'macOS'
        run: |
          bash -n build.sh
          python3 scripts/test_build_scripts.py
          python3 .github/macos/test_keychain_entitlements.py
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build
